name: Documentation checks

# 文档变更的快速门禁：链接、更新记录生成、界面文案目录。只读源码，不需要固定输入或 JDK。
on:
  push:
    paths:
      - '**/*.md'
      - 'docs/**'
      - 'tools/i18n/**'
      - 'app/src/main/res/raw/changelog.md'
      - 'app/src/main/res/raw*/changelog_recent.json'
      - 'updates.json'
      - 'ci/release-identity*.json'
      - 'tools/gpl-binaries.lock.json'
      - 'tools/asset-deployment.json'
      - 'tools/host-tests.manifest.json'
      - 'tools/check-*.py'
      - 'tools/generate-changelog.py'
  pull_request:
    paths:
      - '**/*.md'
      - 'docs/**'
      - 'tools/i18n/**'
      - 'app/src/main/res/raw/changelog.md'
      - 'tools/check-document-links.py'
      - 'tools/generate-changelog.py'
      - 'tools/check-ui-i18n.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  links:
    name: Document links
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check document links
        run: python3 tools/check-document-links.py
  changelog:
    name: Generated changelog
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check generated changelog
        run: python3 tools/generate-changelog.py --check
  i18n:
    name: UI language catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check UI i18n
        run: python3 tools/check-ui-i18n.py
  changelog-sync:
    name: CHANGELOG / App changelog consistency
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: CHANGELOG / App changelog consistency
        run: python3 tools/check-changelog-sync.py --check
  release-notes:
    name: Release notes coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release notes coverage
        run: python3 tools/check-release-notes-coverage.py
  release-prereq:
    name: Release prerequisites
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release prerequisites
        run: python3 tools/check-release-prerequisites.py
  proot:
    name: GPL binary provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: GPL binary provenance
        run: python3 tools/check-proot-provenance.py
  runtime-inputs:
    name: Runtime input contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runtime input contract
        run: python3 tools/check-runtime-input-contract.py
  version-separator:
    name: Version separator consistency
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 2026-11-12 用户真机指出更新页版本行的圆点偏低。根因不只是字符选错，
      # 而是全仓 7 处各自硬编码 " • "，没有统一的垂直居中入口。
      # 这条门禁强制所有版本号分隔走 util/VersionSeparator（内部做 baselineShift）。
      - name: Version separator consistency
        run: python3 tools/check-version-separator.py
  runtime-fixture:
    name: Host-test runtime fixture probe
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 该探针在夹具缺失时返回 1，而 CI 上从没有受管运行时夹具（那是本地构建产物，
      # 在 .gitignore 里）。直接跑会让这条 job 永远红，反而训练人忽略红。
      # 所以这里只要求「manifest 结构完好、探针能跑通」：结构坏会报
      # TEST_MANIFEST_RUNTIME_FIXTURE_MISSING 并以 1 退出，仍会拦住；
      # 只是「夹具未准备」这一种 1 被放过，并把受影响条数打印出来留痕。
      - name: Probe fixture status
        run: |
          set +e
          python3 tools/check-test-runtime-fixture.py --check
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::notice::受管运行时夹具未准备（CI 正常现象）；需要时本地跑 python3 tools/prepare-test-runtime.py --offline"
          fi
          python3 tools/check-test-runtime-fixture.py --check --json > /tmp/fixture.json || true
          python3 tools/fixture-probe-shape.py /tmp/fixture.json
